<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>研究報告</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    margin: 0;
    line-height: 1.7;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #e5e5e5;
    background: #fff;
    position: sticky;
    top: 0;
  }
  header a { color: #555; text-decoration: none; font-size: 0.9rem; }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    background: #fff;
  }
  main table { border-collapse: collapse; width: 100%; margin: 1rem 0; overflow-x: auto; display: block; }
  main table, main th, main td { border: 1px solid #ddd; }
  main th, main td { padding: 0.5rem 0.75rem; text-align: left; }
  main th { background: #f5f5f5; }
  main h1 { border-bottom: 2px solid #222; padding-bottom: 0.5rem; }
  main h2 { margin-top: 2rem; border-left: 4px solid #333; padding-left: 0.6rem; }
  main code { background: #f0f0f0; padding: 0.1rem 0.3rem; border-radius: 3px; }
  main blockquote { border-left: 4px solid #ccc; margin-left: 0; padding-left: 1rem; color: #555; }
  #loading { color: #888; padding: 2rem 0; }
</style>
</head>
<body>
<header><a href="./index.html">← 回報告列表</a></header>
<main>
  <div id="loading">載入中…</div>
  <div id="content"></div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const contentEl = document.getElementById('content');
  const loadingEl = document.getElementById('loading');

  if (!file) {
    loadingEl.textContent = '未指定報告檔案';
  } else {
    fetch(file)
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(md => {
        loadingEl.style.display = 'none';
        contentEl.innerHTML = marked.parse(md);
        document.title = (contentEl.querySelector('h1')?.textContent || '研究報告') + ' - 研究報告';
      })
      .catch(err => {
        loadingEl.textContent = '載入失敗：' + err.message;
      });
  }
</script>
</body>
</html>
